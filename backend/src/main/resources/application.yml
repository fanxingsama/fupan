server:
  port: 8080

spring:
  application:
    name: daily-recap-backend
  datasource:
    url: jdbc:sqlite:recap.db
    driver-class-name: org.sqlite.JDBC
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 200MB
  sql:
    init:
      mode: always

recap:
  storage-root: data
  provider: tushare
  python-executable: .venv/Scripts/python.exe
  collector-script: scripts/collect_tushare.py
  intelligence-script: scripts/collect_market_intelligence.py
  sleep-seconds: 1.2

ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:litellm}
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:http://127.0.0.1:4000/v1}
  model: ${AI_MODEL:recap-main}
  summary-storage-root: ai-summaries
  timeout-seconds: ${AI_TIMEOUT_SECONDS:120}

trade-journal:
  storage-root: trade-journal
